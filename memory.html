<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الذاكرة | Diga Games</title>
    <!-- 💡 ضع كود Monetag هنا لاحقاً -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #333; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-btn:hover { background: #555; }
        h1 { color: #00e5ff; font-size: 1.5rem; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 1.1rem; color: #ff4081; font-weight: bold; }
        .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; margin: 0 auto; perspective: 1000px; }
        .card { width: 100%; height: 80px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg); opacity: 0.6; pointer-events: none; }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 2rem; }
        .card-front { background: linear-gradient(45deg, #007bff, #00e5ff); }
        .card-back { background: #1e1e1e; border: 2px solid #333; transform: rotateY(180deg); }
        #restartBtn { margin-top: 20px; padding: 10px 30px; font-size: 1.1rem; background: #28a745; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; display: none; }
        #message { margin-top: 15px; font-size: 1.3rem; color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
        <h1>🧠 لعبة الذاكرة</h1>
    </div>

    <div class="stats">
        <div>الحركات: <span id="moves">0</span></div>
        <div>الأزواج: <span id="pairs">0</span>/8</div>
    </div>

    <div class="game-board" id="gameBoard"></div>
    <div id="message"></div>
    <button id="restartBtn" onclick="initGame()">العب مرة أخرى 🔄</button>

    <script>
        const emojis = ['🚗', '🏎️', '🔧', '⚙️', '🛞', '🔋', '💡', '🛠️'];
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let lockBoard = false;

        function initGame() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            document.getElementById('moves').innerText = '0';
            document.getElementById('pairs').innerText = '0';
            document.getElementById('message').innerText = '';
            document.getElementById('restartBtn').style.display = 'none';
            
            moves = 0; matchedPairs = 0; flippedCards = []; lockBoard = false;

            // إنشاء الأزواج وخلطها
            cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-front"></div>
                    <div class="card-back">${emoji}</div>
                `;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('pairs').innerText = matchedPairs;
                flippedCards = [];
                
                if (matchedPairs === emojis.length) {
                    document.getElementById('message').innerText = '🎉 مبروك! لقد فزت!';
                    document.getElementById('restartBtn').style.display = 'inline-block';
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        // بدء اللعبة عند التحميل
        initGame();
    </script>

</body>
</html>
